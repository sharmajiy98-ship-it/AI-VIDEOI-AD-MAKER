<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Video Ad Maker</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#08080d;
    color:white;
}

/* HERO */

.hero{
    min-height:430px;
    padding:35px 20px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
    overflow:hidden;
    transition:.5s;
}

.hero:before{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    background:#7c3aed;
    filter:blur(130px);
    opacity:.35;
    border-radius:50%;
}

.hero-content{
    position:relative;
    z-index:2;
}

.logo-icon{
    font-size:65px;
    margin-bottom:10px;
}

.hero h1{
    font-size:42px;
    letter-spacing:2px;
}

.hero p{
    margin-top:12px;
    font-size:17px;
    color:#ddd;
}

/* STYLE COLORS */

.cinematic{
    background:
    radial-gradient(circle at 50% 30%,#312e81,#08080d 70%);
}

.luxury{
    background:
    radial-gradient(circle at 50% 30%,#78350f,#08080d 70%);
}

.business{
    background:
    radial-gradient(circle at 50% 30%,#075985,#08080d 70%);
}

.modern{
    background:
    radial-gradient(circle at 50% 30%,#065f46,#08080d 70%);
}

/* CONTAINER */

.container{
    max-width:1000px;
    margin:auto;
    padding:25px 15px;
}

/* STYLE CARD */

.style-title{
    text-align:center;
    margin-bottom:18px;
    font-size:22px;
}

.styles{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.style-card{
    min-height:150px;
    border:1px solid #333;
    border-radius:18px;
    padding:20px 10px;
    text-align:center;
    cursor:pointer;
    background:#121218;
    transition:.25s;
}

.style-card:hover{
    transform:translateY(-5px);
}

.style-card.selected{
    border:2px solid #a78bfa;
    background:#21163a;
    box-shadow:0 0 25px rgba(124,58,237,.3);
}

.style-icon{
    font-size:38px;
    margin-bottom:12px;
}

.style-card h3{
    margin-bottom:6px;
}

.style-card p{
    font-size:12px;
    color:#aaa;
}

/* BUTTON */

.main-btn{
    display:block;
    margin:25px auto;
    padding:15px 35px;
    border:none;
    border-radius:12px;
    color:white;
    background:linear-gradient(135deg,#7c3aed,#a855f7);
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

/* FORM */

.form-section{
    display:none;
    background:white;
    color:#111;
    border-radius:20px;
    padding:25px;
    margin-top:25px;
}

.form-section h2{
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.field{
    display:flex;
    flex-direction:column;
}

.full{
    grid-column:1/-1;
}

label{
    font-weight:bold;
    margin-bottom:7px;
}

input,select,textarea{
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
}

textarea{
    min-height:100px;
}

.order-btn{
    width:100%;
    margin-top:20px;
    padding:15px;
    background:#111827;
    color:white;
    border:none;
    border-radius:10px;
    font-weight:bold;
}

/* SUCCESS */

.success{
    display:none;
    background:#ecfdf5;
    color:#166534;
    padding:20px;
    border-radius:15px;
    margin-top:20px;
}

@media(max-width:700px){

    .hero{
        min-height:370px;
    }

    .hero h1{
        font-size:30px;
    }

    .styles{
        grid-template-columns:1fr 1fr;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }
}
</style>
</head>


<body>


<!-- HERO POSTER -->

<section id="hero" class="hero cinematic">

    <div class="hero-content">

        <div class="logo-icon" id="logoIcon">🎬</div>

        <h1>AI VIDEO AD MAKER</h1>

        <p id="heroText">
            Turn Your Business Into A Powerful Video
        </p>

    </div>

</section>


<div class="container">


    <!-- STYLE SELECTION -->

    <h2 class="style-title">
        Choose Your Ad Style
    </h2>


    <div class="styles">


        <div
        class="style-card selected"
        onclick="selectStyle('cinematic',this)">

            <div class="style-icon">🎬</div>

            <h3>Cinematic</h3>

            <p>
                Dramatic & powerful
            </p>

        </div>


        <div
        class="style-card"
        onclick="selectStyle('luxury',this)">

            <div class="style-icon">👑</div>

            <h3>Luxury</h3>

            <p>
                Premium & elegant
            </p>

        </div>


        <div
        class="style-card"
        onclick="selectStyle('business',this)">

            <div class="style-icon">💼</div>

            <h3>Business</h3>

            <p>
                Clean & professional
            </p>

        </div>


        <div
        class="style-card"
        onclick="selectStyle('modern',this)">

            <div class="style-icon">⚡</div>

            <h3>Modern</h3>

            <p>
                Fresh & energetic
            </p>

        </div>

    </div>


    <button
    class="main-btn"
    onclick="showOrderForm()">

        🚀 CREATE MY VIDEO AD

    </button>


    <!-- ORDER FORM -->

    <div
    class="form-section"
    id="orderForm">

        <h2>
            📝 Video Order Details
        </h2>

        <div class="grid">


            <div class="field">

                <label>
                    Business Name *
                </label>

                <input
                id="businessName"
                placeholder="e.g. Variety Kennel">

            </div>


            <div class="field">

                <label>
                    Your Name *
                </label>

                <input
                id="customerName"
                placeholder="Your Name">

            </div>


            <div class="field">

                <label>
                    WhatsApp Number *
                </label>

                <input
                id="phone"
                placeholder="9876543210">

            </div>


            <div class="field">

                <label>
                    Business Type
                </label>

                <input
                id="businessType"
                placeholder="e.g. Dog Kennel">

            </div>


            <div class="field">

                <label>
                    Location
                </label>

                <input
                id="location"
                placeholder="City / Area">

            </div>


            <div class="field">

                <label>
                    Video Duration
                </label>

                <select id="duration">

                    <option>30 Seconds</option>
                    <option>40 Seconds</option>
                    <option>50 Seconds</option>
                    <option>60 Seconds</option>

                </select>

            </div>


            <div class="field">

                <label>
                    Language
                </label>

                <select id="language">

                    <option>Hindi</option>
                    <option>Hinglish</option>
                    <option>English</option>

                </select>

            </div>


            <div class="field">

                <label>
                    Package
                </label>

                <select id="package">

                    <option>1 Video - ₹499</option>
                    <option>2 Videos - ₹850</option>
                    <option>5 Videos - ₹2000</option>
                    <option>10 Videos + 1 Free</option>

                </select>

            </div>


            <div class="field full">

                <label>
                    Business Details / Requirements
                </label>

                <textarea
                id="details"
                placeholder="अपने business और video के बारे में बताएं..."></textarea>

            </div>


            <div class="field full">

                <label>
                    Upload Photos / Videos
                </label>

                <input
                type="file"
                id="media"
                accept="image/*,video/*"
                multiple>

            </div>

        </div>


        <button
        class="order-btn"
        onclick="placeOrder()">

            📲 SEND ORDER ON WHATSAPP

        </button>


        <div
        class="success"
        id="success">

            🎉 Order तैयार है!

            <br><br>

            Order ID:
            <strong id="orderID"></strong>

        </div>

    </div>

</div>


<script>

let selectedStyle = "Cinematic";


function selectStyle(style,element){

    selectedStyle =
        style.charAt(0).toUpperCase()
        + style.slice(1);

    document
    .querySelectorAll(".style-card")
    .forEach(card =>
        card.classList.remove("selected")
    );

    element.classList.add("selected");


    const hero =
        document.getElementById("hero");

    const icon =
        document.getElementById("logoIcon");

    const text =
        document.getElementById("heroText");


    hero.className =
        "hero " + style;


    if(style === "cinematic"){

        icon.innerText = "🎬";

        text.innerText =
        "Dramatic Visuals. Powerful Business Stories.";

    }


    if(style === "luxury"){

        icon.innerText = "👑";

        text.innerText =
        "Premium Design For Premium Brands.";

    }


    if(style === "business"){

        icon.innerText = "💼";

        text.innerText =
        "Professional Videos That Promote Your Business.";

    }


    if(style === "modern"){

        icon.innerText = "⚡";

        text.innerText =
        "Modern Content. Maximum Attention.";

    }

}


function showOrderForm(){

    const form =
        document.getElementById("orderForm");

    form.style.display = "block";

    form.scrollIntoView({
        behavior:"smooth"
    });

}


function placeOrder(){

    const business =
        document.getElementById("businessName").value;

    const name =
        document.getElementById("customerName").value;

    const phone =
        document.getElementById("phone").value;

    const type =
        document.getElementById("businessType").value;

    const location =
        document.getElementById("location").value;

    const duration =
        document.getElementById("duration").value;

    const language =
        document.getElementById("language").value;

    const pack =
        document.getElementById("package").value;

    const details =
        document.getElementById("details").value;


    if(!business || !name || !phone){

        alert(
        "Please Business Name, Name और WhatsApp Number भरें."
        );

        return;

    }


    const id =
        "AD-" +
        Math.floor(
            10000 + Math.random()*90000
        );


    document.getElementById("orderID")
    .innerText = id;


    document.getElementById("success")
    .style.display = "block";


    /*
      अपना WhatsApp number यहाँ डालें.
      Example:
      9189308087XX
    */

    const YOUR_NUMBER =
        "9189308087";


    const message =

`🎬 NEW VIDEO AD ORDER

Order ID: ${id}

👤 Customer:
${name}

🏢 Business:
${business}

📌 Business Type:
${type}

📍 Location:
${location}

🎨 Style:
${selectedStyle}

⏱ Duration:
${duration}

🌐 Language:
${language}

📦 Package:
${pack}

📝 Requirements:
${details}


Please confirm my order.`;


    const whatsappURL =
        "https://wa.me/" +
        YOUR_NUMBER +
        "?text=" +
        encodeURIComponent(message);


    window.open(
        whatsappURL,
        "_blank"
    );

}

</script>

</body>
</html>
